services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: book_archive
      POSTGRES_USER: ${DB_USER:-book}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-book}
      TZ: UTC
    volumes:
      # 스키마는 server 기동 시 Flyway 가 만든다 (server/src/main/resources/db/migration)
      - db-data:/var/lib/postgresql/data
    ports:
      # 호스트 5432 는 이미 사용 중이라 5433 으로 노출 (DB 툴 접속용)
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    environment:
      DB_URL: jdbc:postgresql://db:5432/book_archive
      DB_USER: ${DB_USER:-book}
      DB_PASSWORD: ${DB_PASSWORD:-book}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 을 .env 에 설정하세요}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  db-data:
